name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Patches/**"
      - "Scripts/build-unsigned-ipa.sh"
      - ".github/workflows/build-unsigned-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: bash Scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PsychonautWiki-Journal-unsigned
          path: |
            build/output/PsychonautWiki-Journal-unsigned.ipa
            build/output/PsychonautWiki-Journal-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
